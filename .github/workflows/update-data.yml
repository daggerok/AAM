name: Update AAM ETF data

on:
  # Weekly refresh (every Sunday 00:00 UTC) plus manual runs; NEVER on push.
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Vanguard/JPMorgan pattern: blank inputs inherit checked-in JSON defaults.
    # GitHub permits 25 inputs. SEC_UA and VERBOSE remain config-file/CLI-only.
    inputs:
      max_fetches:
        description: "Batch size; blank uses JSON default; 0 is a full selected pass, positive resumes the ticker cursor"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between request starts per independent lane; keep >=1 for live sources"
        required: false
        default: ""
        type: string
      concurrency:
        description: "Parallel fund workers and request lanes; keep conservative"
        required: false
        default: ""
        type: string
      holdings_page_size:
        description: "Rows per current-holdings JSON page"
        required: false
        default: ""
        type: string
      history_page_size:
        description: "Rows per daily market-price history JSON page"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries after the initial request; transient/network errors only"
        required: false
        default: ""
        type: string
      tickers:
        description: "Ticker allowlist separated by spaces, commas or semicolons; AND with other filters"
        required: false
        default: ""
        type: string
      history_range:
        description: "Yahoo history coverage: max or Ny; previously published older rows retained"
        required: false
        default: ""
        type: string
      edgar_fallback:
        description: "Enable identity-verified SEC N-PORT holdings fallback; blank uses JSON default"
        required: false
        default: ""
        type: string
      skip_aam:
        description: "Skip AAM source requests and use published catalog/holdings/headlines"
        required: false
        default: ""
        type: string
      skip_yahoo:
        description: "Skip Yahoo history/dividends and retain published history"
        required: false
        default: ""
        type: string
      aum:
        description: "Net Assets min:max; USD K/M/B/T bounds or nano/micro/small/mid/large preset"
        required: false
        default: ""
        type: string
      ter:
        description: "Gross expense ratio percentage range: min:max, min:, :max, or :"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Indicated dividend-yield percentage range; colon required"
        required: false
        default: ""
        type: string
      sec_yield:
        description: "30-day SEC-yield percentage range; unsubsidized where separately published"
        required: false
        default: ""
        type: string
      performance_ytd:
        description: "YTD return range (%); annualized for 3Y+; colon required"
        required: false
        default: ""
        type: string
      performance_1y:
        description: "1Y return range (%); annualized for 3Y+; colon required"
        required: false
        default: ""
        type: string
      performance_3y:
        description: "3Y return range (%); annualized for 3Y+; colon required"
        required: false
        default: ""
        type: string
      performance_5y:
        description: "5Y return range (%); annualized for 3Y+; colon required"
        required: false
        default: ""
        type: string
      performance_10y:
        description: "10Y return range (%); annualized for 3Y+; colon required"
        required: false
        default: ""
        type: string
      total_return_ytd:
        description: "YTD cumulative total-return range (%); colon required"
        required: false
        default: ""
        type: string
      total_return_1y:
        description: "1Y cumulative total-return range (%); colon required"
        required: false
        default: ""
        type: string
      total_return_3y:
        description: "3Y cumulative total-return range (%); colon required"
        required: false
        default: ""
        type: string
      total_return_5y:
        description: "5Y cumulative total-return range (%); colon required"
        required: false
        default: ""
        type: string
      total_return_10y:
        description: "10Y cumulative total-return range (%); colon required"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      MAX_FETCHES: ${{ inputs.max_fetches || '' }}
      REQUEST_SLEEP: ${{ inputs.request_sleep || '' }}
      CONCURRENCY: ${{ inputs.concurrency || '' }}
      HOLDINGS_PAGE_SIZE: ${{ inputs.holdings_page_size || '' }}
      HISTORY_PAGE_SIZE: ${{ inputs.history_page_size || '' }}
      MAX_RETRIES: ${{ inputs.max_retries || '' }}
      TICKERS: ${{ inputs.tickers || '' }}
      HISTORY_RANGE: ${{ inputs.history_range || '' }}
      EDGAR_FALLBACK: ${{ inputs.edgar_fallback || '' }}
      SKIP_AAM: ${{ inputs.skip_aam || '' }}
      SKIP_YAHOO: ${{ inputs.skip_yahoo || '' }}
      AUM: ${{ inputs.aum || '' }}
      TER: ${{ inputs.ter || '' }}
      DIVIDEND_YIELD: ${{ inputs.dividend_yield || '' }}
      SEC_YIELD: ${{ inputs.sec_yield || '' }}
      PERFORMANCE_YTD: ${{ inputs.performance_ytd || '' }}
      PERFORMANCE_1Y: ${{ inputs.performance_1y || '' }}
      PERFORMANCE_3Y: ${{ inputs.performance_3y || '' }}
      PERFORMANCE_5Y: ${{ inputs.performance_5y || '' }}
      PERFORMANCE_10Y: ${{ inputs.performance_10y || '' }}
      TOTAL_RETURN_YTD: ${{ inputs.total_return_ytd || '' }}
      TOTAL_RETURN_1Y: ${{ inputs.total_return_1y || '' }}
      TOTAL_RETURN_3Y: ${{ inputs.total_return_3y || '' }}
      TOTAL_RETURN_5Y: ${{ inputs.total_return_5y || '' }}
      TOTAL_RETURN_10Y: ${{ inputs.total_return_10y || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run offline unit and parity tests
        run: bun test

      - name: Generate api/aam static data
        run: bun ./scripts/update-data.ts

      - name: Validate generated feed and run offline regressions
        run: |
          bun scripts/verify-feed.ts --require-complete
          bun test
          git diff --check

      - name: Commit changed AAM data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Stage first so new pages are not missed by an unstaged diff check.
          git add -- api/aam
          if git diff --cached --quiet -- api/aam; then
            echo "api/aam is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh AAM ETF feed"
          # Runtime-only auth; no token/header stored in URL, file or Git config.
          git -c credential.helper= -c credential.helper='!f() { if test "$1" = get; then printf "username=x-access-token\npassword=%s\n" "$GITHUB_TOKEN"; fi; }; f' push
